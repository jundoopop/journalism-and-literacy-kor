<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하이라이터 설정</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 12px;
    }

    .section {
      background: rgba(255, 255, 255, 0.15);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .radio-option:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .radio-option input[type="radio"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .radio-option label {
      flex: 1;
      cursor: pointer;
      font-size: 13px;
    }

    .radio-description {
      font-size: 11px;
      opacity: 0.8;
      margin-left: 28px;
      margin-top: -4px;
      margin-bottom: 4px;
    }

    .provider-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .provider-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
    }

    .provider-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .provider-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .provider-item input[type="checkbox"]:disabled {
      cursor: not-allowed;
    }

    .provider-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
    }

    .provider-badge {
      padding: 2px 8px;
      font-size: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
    }

    .provider-badge.required {
      background: rgba(76, 175, 80, 0.3);
    }

    .color-legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }

    .color-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-box {
      width: 40px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .color-box.high {
      background: #00ff00;
    }

    .color-box.medium {
      background: #ffff00;
    }

    .color-box.low {
      background: #87ceeb;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    #saveBtn {
      background: white;
      color: #667eea;
    }

    #saveBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    #cancelBtn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    #cancelBtn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .status {
      margin-top: 8px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      font-size: 13px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .status.show {
      opacity: 1;
    }

    .status.success {
      background: rgba(76, 175, 80, 0.3);
    }

    .status.error {
      background: rgba(244, 67, 54, 0.3);
    }
  </style>
</head>

<body>
  <div class="container">
    <div>
      <h1>⚙️ 설정</h1>
      <p class="subtitle">분석 모드 및 LLM 제공자 선택</p>
    </div>

    <!-- Analysis Mode Section -->
    <div class="section">
      <div class="section-title">📊 분석 모드</div>
      <div class="mode-selector">
        <div class="radio-option">
          <input type="radio" id="singleMode" name="mode" value="single">
          <label for="singleMode">단일 모드 (빠름)</label>
        </div>
        <div class="radio-description">선택한 제공자 하나로 분석합니다.</div>

        <div class="radio-option">
          <input type="radio" id="consensusMode" name="mode" value="consensus">
          <label for="consensusMode">합의 모드 (비교)</label>
        </div>
        <div class="radio-description">여러 제공자의 결과를 비교합니다. 합의는 정확성을 보장하지 않으며 비용이 증가합니다.</div>
      </div>
    </div>

    <!-- Provider Selection Section -->
    <div class="section" id="providerSection">
      <div class="section-title">🤖 LLM 제공자 선택</div>
      <div class="provider-list">
        <div class="provider-item">
          <input type="checkbox" id="gemini" value="gemini" checked>
          <span class="provider-name">Gemini</span>
          <span class="provider-badge">선택</span>
        </div>

        <div class="provider-item">
          <input type="checkbox" id="openai" value="openai">
          <span class="provider-name">OpenAI (GPT)</span>
          <span class="provider-badge">선택</span>
        </div>

        <div class="provider-item">
          <input type="checkbox" id="claude" value="claude">
          <span class="provider-name">Claude (Anthropic)</span>
          <span class="provider-badge">선택</span>
        </div>
        <div class="provider-item">
          <input type="checkbox" id="mistral" value="mistral">
          <label class="provider-name" for="mistral">Mistral (Ministral)</label>
          <span class="provider-badge">경량</span>
        </div>
        <div class="provider-item">
          <input type="checkbox" id="llama" value="llama">
          <label class="provider-name" for="llama">Llama (Together)</label>
          <span class="provider-badge">기존 모델 · 사용 가능 여부 확인 필요</span>
        </div>
        <p>사용할 제공자의 API 키를 서버에 설정하세요. 모델은 서버 설정을 따릅니다.</p>
      </div>
    </div>

    <!-- Color Legend Section -->
    <div class="section" id="colorLegend">
      <div class="section-title">🎨 하이라이트 색상 가이드</div>
      <div class="color-legend">
        <div class="color-item">
          <div class="color-box high"></div>
          <span>높은 합의 (모든 모델 동의)</span>
        </div>
        <div class="color-item">
          <div class="color-box medium"></div>
          <span>중간 합의 (2개 모델 동의)</span>
        </div>
        <div class="color-item">
          <div class="color-box low"></div>
          <span>낮은 합의 (1개 모델만)</span>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="buttons">
      <button id="saveBtn">저장</button>
      <button id="cancelBtn">취소</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="settings.js"></script>
</body>

</html>
